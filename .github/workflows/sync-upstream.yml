name: Sync with Upstream

on:
  schedule:
    - cron: '0 6 * * *'          # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync master + tags from upstream
        run: |
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git || true
          git fetch upstream --tags --force

          git checkout master
          git merge --ff-only upstream/master || {
            echo "Fast-forward failed (local commits on master). Skipping."
            exit 0
          }

          git push origin master
          git push origin --tags --force

name: Release with executable (notifications enabled)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build with update notifications
        shell: pwsh
        run: ./build.ps1 -Configuration Release -EnableUpdateNotifications

      - name: Create GitHub Release + attach .exe
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Automated build of [k1tbyte/Wand-Enhancer](https://github.com/k1tbyte/Wand-Enhancer) `${{ github.ref_name }}`  
            **Includes update notifications** (checks this repository’s releases).

            Built from commit `${{ github.sha }}`.
          files: |
            WandEnhancer/bin/Release/WandEnhancer.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
